    <line x1="610" y1="110" x2="710" y2="110"/><line x1="610" y1="150" x2="710" y2="150"/><line x1="610" y1="190" x2="710" y2="190"/><line x1="610" y1="230" x2="710" y2="230"/>
  </g>
